services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: loseucaliptos-api
    restart: unless-stopped
    env_file: .env
    # Solo accesible desde el host (Nginx hace de proxy). No se expone a internet.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data       # base SQLite (persistente, fuera de la imagen)
      - ./uploads:/app/uploads # imagenes de productos (las sirve Nginx)
    # Permite alcanzar n8n (y otros servicios del host) por host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
